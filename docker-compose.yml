version: '3.8'

services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: hotelbooking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotelbooking}
      MYSQL_USER: ${MYSQL_USER:-hotel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel_pass}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hotelbooking-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ==========================================
  # Redis Cache Service
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: hotelbooking-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - hotelbooking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ==========================================
  # Spring Boot Backend Service
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotelbooking-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-hotelbooking}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}
      MAIL_USERNAME: ${MAIL_USERNAME:-java.project.uth@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-yghirekhxazxmmqc}
      ACCOUNT_ADMIN_USERNAME: ${ACCOUNT_ADMIN_USERNAME:-admin@gmail.com}
      ACCOUNT_ADMIN_PASSWORD: ${ACCOUNT_ADMIN_PASSWORD:-admin123}
      ACCOUNT_DEFAULT_PASSWORD: ${ACCOUNT_DEFAULT_PASSWORD:-password123}
      FIREBASE_SERVICE_ACCOUNT_KEY_PATH: ${FIREBASE_SERVICE_ACCOUNT_KEY_PATH:-./booking-hotel-app-43981-firebase-adminsdk-fbsvc-c91a1a3701.json}
      CDN_CLOUD_NAME: ${CDN_CLOUD_NAME:-dwv3hqktb}
      CDN_API_KEY: ${CDN_API_KEY:-644745652752952}
      CDN_API_SECRET: ${CDN_API_SECRET:-b_rYnyZeKpVbo8QZPp7tJ2cKi8Y}
      ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-2553}
      ZALOPAY_KEY1: ${ZALOPAY_KEY1:-PcY4iZIKFCIdgZvA6ueMcMHHUbRLYjPL}
      ZALOPAY_KEY2: ${ZALOPAY_KEY2:-kLtgPl8HHhfvMuDHPwKfgfsY4Ydm9eIz}
      ZALOPAY_ENDPOINT: ${ZALOPAY_ENDPOINT:-https://sb-openapi.zalopay.vn/v2/create}
      ZALOPAY_CALLBACK_URL: ${ZALOPAY_CALLBACK_URL:-https://bilateral-misunderstandingly-veola.ngrok-free.dev/api/zalopay/callback}
      ZALOPAY_REDIRECT_URL: ${ZALOPAY_REDIRECT_URL:-hotelbooking://calendar_detail}
    volumes:
      - ./logs:/app/logs
    networks:
      - hotelbooking-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

# ==========================================
# Networks & Volumes Configuration
# ==========================================
networks:
  hotelbooking-network:
    name: hotelbooking-network
    driver: bridge

volumes:
  mysql_data:
    name: hotelbooking_mysql_data
  redis_data:
    name: hotelbooking_redis_data